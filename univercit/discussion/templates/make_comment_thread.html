<div class="divider my-8"></div>
<form action="{% url 'add_comment' thread_id=thread.thread_id %}" method="post" class="card bg-base-200 shadow-xl sticky mb-8 z-10">
    {% csrf_token %}
    <div class="card-body">
        <h3 class="card-title text-lg mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            Add Your Comment
        </h3>
        <div class="form-control w-full">
            <textarea
                id="content"
                name="content"
                class="textarea textarea-bordered h-24 w-full resize-none"
                placeholder="Share your thoughts..."
                required
            >{{ content }}</textarea>
            <div class="flex justify-between items-center mt-3">
                <button type="submit" class="btn btn-primary gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    Post Comment
                </button>
            </div>
        </div>
    </div>
</form>
