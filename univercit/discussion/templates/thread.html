<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ thread.thread_title }}</title>
    {% load static %}
    <link href="{% static 'css/src/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="m-8">

    <a href="{% url 'forum' forum_id=thread.forum_id.forum_id %}" class="btn btn-soft">Back to Forum</a>

    <h1> {{ thread.thread_title }} </h1>
    <br>
    <ul>
        {% for comment in thread_comments %}
            {% include 'thread_comment_card.html' %}
        {% endfor %}
    </ul>

    {% include 'make_comment_thread.html' %}
</body>
</html>
