<div class="flex items-start gap-4">
    <div class="flex flex-col items-center gap-1">
        <!-- upvote button -->
        <form method="post" action="{% url 'rate' %}" class="m-0">
            {% csrf_token %}
            <input type="hidden" name="item_id" value="{{ item.item_id }}">
            <input type="hidden" name="item_type" value="{{ item.item_type }}">
            <input type="hidden" name="action" value="upvote">
            <input type="hidden" name="next" value="{% url 'ratingView' %}">
            <button type="submit" class="btn {% if item.user_vote == 'upvote' %}bg-success text-success-content shadow-md{% else %}btn-ghost hover:bg-success/20{% endif %} btn-sm p-2 active:scale-95 transition-all">
                ↑
            </button>
        </form>
        <!-- vote count -->
        <span class="text-sm font-semibold {% if item.vote_count < 0 %}text-error{% elif item.vote_count > 0 %}text-success{% else %}text-base-content{% endif %}">{{ item.vote_count }}</span>
        <!-- downvote button -->
        <form method="post" action="{% url 'rate' %}" class="m-0">
            {% csrf_token %}
            <input type="hidden" name="item_id" value="{{ item.item_id }}">
            <input type="hidden" name="item_type" value="{{ item.item_type }}">
            <input type="hidden" name="action" value="downvote">
            <input type="hidden" name="next" value="{% url 'ratingView' %}">
            <button type="submit" class="btn {% if item.user_vote == 'downvote' %}bg-error text-error-content shadow-md{% else %}btn-ghost hover:bg-error/20{% endif %} btn-sm p-2 active:scale-95 transition-all">
                ↓
            </button>
        </form>
    </div>
    <!-- card  -->
    <div class="card shadow-sm h-full flex-1">
        <div class="card-body">
            <h1 class="card-title">{{ item.student_username }}</h1>
            <h2>{{ item.content }}</h2>
        </div>
    </div>
</div>
