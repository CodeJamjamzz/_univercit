{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/src/output.css'%}" rel="stylesheet" type="text/css" />
    <title>UniverCIT Dashboard</title>
</head>
<body>
    <div class="drawer lg:drawer-open">
    <input id="my-drawer"
       type="checkbox"
       class="drawer-toggle"
       {% if request.COOKIES.isDrawerOpen == 'true' %}checked{% endif %}>
    <div class="drawer-content">
        <!-- Navbar -->
        <nav class="navbar w-full bg-base-300 sticky top-0 z-40">
        <label for="my-drawer" aria-label="open sidebar" class="btn btn-square btn-ghost">
            <!-- Sidebar toggle icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
        </label>
        <div class="px-4">{% block title %}{% endblock %}</div>
        </nav>
        <!-- Page content here -->
        <div class="px-12 py-6">
            <main id="main-content">
                {% block body %}{% endblock %}
            </main>
        </div>
    </div>

    <aside class="drawer-side is-drawer-close:overflow-visible">
        <label for="my-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
        <div class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-14 is-drawer-open:w-64">
        <!-- Sidebar content here -->
        <ul class="menu w-full grow">
            <!-- List item -->
            <li>
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Dashboard">
                <!-- Home icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span class="is-drawer-close:hidden">Dashboard</span>
            </button>
            </li>

            <!-- List item -->
            <li>
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Settings">
                <!-- Settings icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>
                <span class="is-drawer-close:hidden">Settings</span>
            </button>
            </li>

            <li>
                <div class="is-drawer-close:tooltip is-drawer-close:tooltip-right pointer-events-none">
                     <svg class="my-1.5 inline-block size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M6 12h.01m6 0h.01m5.99 0h.01"/></svg>
                    <span class="is-drawer-close:hidden">Authentication</span>
                </div>
            </li>
            
            <li>
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Program">
                <!-- User icon -->
                <svg class="my-1.5 inline-block size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                <span class="is-drawer-close:hidden">Users</span>
            </button>
            </li>

            <li>
                <div class="is-drawer-close:tooltip is-drawer-close:tooltip-right pointer-events-none">
                     <svg class="my-1.5 inline-block size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M6 12h.01m6 0h.01m5.99 0h.01"/></svg>
                    <span class="is-drawer-close:hidden">Curriculum</span>
                </div>
            </li>
            
            <li>
            <a id="link-programs" href="{% url 'dashboard_program_list' %}" class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Program">
                <!-- Program icon -->
                <svg class="my-1.5 inline-block size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.78552 9.5 12.7855 14l9-4.5-9-4.5-8.99998 4.5Zm0 0V17m3-6v6.2222c0 .3483 2 1.7778 5.99998 1.7778 4 0 6-1.3738 6-1.7778V11"/></svg>
                <span class="is-drawer-close:hidden">Programs</span>
            </a>
            </li>

            <li>
            <a id="link-courses" href="{% url 'dashboard_course_list' %}" class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Course">
                <!-- Course icon -->
                <svg class="my-1.5 inline-block size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v13H7a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12M9 3v14m7 0v4"/></svg>
                <span class="is-drawer-close:hidden">Courses</span>
            </a>
            </li>
        </ul>
        </div>
    </aside>
    </div>
    <script src="{% static 'js/dashboard_sidebar.js' %}"></script>
    {% block script %}{% endblock %}
</body>
</html>
