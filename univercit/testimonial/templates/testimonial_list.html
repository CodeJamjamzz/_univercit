<!DOCTYPE html>
<html>
<head>
    <title>Testimonials</title>
</head>
<body>
    <h1>All Testimonials</h1>
    <ul>
        {% for t in testimonials %}
            <li>
                <strong>{{ t.content }}</strong>
                {% if t.course_id %}<br>Course: {{ t.course_id }}{% endif %}
                {% if t.student_id %}<br>Student: {{ t.student_id }}{% endif %}
            </li>
        {% empty %}
            <li>No testimonials found.</li>
        {% endfor %}
    </ul>
</body>
</html>
