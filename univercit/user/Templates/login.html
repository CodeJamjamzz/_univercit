{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniverCIT - Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .full-background {
            background-image: url("{% static 'signup_bg.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="full-background"></div>

    <main class="min-h-screen flex items-center justify-center relative p-4">
        <div class="card w-full max-w-md shrink-0 shadow-2xl bg-white z-10">
            <form class="card-body" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <h1 class="card-title text-2xl font-bold">Log in to your account</h1>

                <!-- Display error message -->
                {% if error %}
                    <div class="text-red-600 font-semibold mb-2">{{ error }}</div>
                {% endif %}

                <!-- Email Input -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" name="email" required class="input input-bordered" />
                </div>

                <!-- Password Input -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" name="password" required class="input input-bordered" />
                </div>

                <!-- Remember Me -->
                <div class="flex justify-between items-center text-sm mt-2">
                    <div class="form-control">
                        <label class="label cursor-pointer gap-2">
                            <input type="checkbox" checked="checked" class="checkbox checkbox-sm" />
                            <span class="label-text">Remember me</span>
                        </label>
                    </div>
                    <a href="#" class="link link-hover">Forgot password?</a>
                </div>

                <div class="form-control mt-6">
                    <button type="submit" class="btn border-none text-black" style="background-color: #fde047; hover:background-color: #facc15;">
                        Log in
                    </button>
                </div>

                <div class="divider">OR</div>

                <!-- Social Login Buttons -->
                <div class="grid grid-cols-1 gap-3">

                    <!-- Google -->
                    <button type="button" class="btn btn-outline font-normal flex items-center gap-3">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg"
                             alt="Google" class="w-5 h-5">
                        Log in with Google
                    </button>

                    <!-- Facebook -->
                    <button type="button" class="btn btn-outline font-normal flex items-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"
             alt="Facebook" class="w-5 h-5 rounded-full"> Log in with Facebook
                    </button>

                    <!-- Outlook -->
                    <button type="button" class="btn btn-outline font-normal flex items-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
             alt="Outlook" class="w-5 h-5">
                        Log in with Outlook
                    </button>

                </div>

                <p class="text-center mt-6 text-sm">
                    New to UniverCIT?
                    <a href="{% url 'signin' %}" class="link" style="color: #d94b3d;">Create account</a>
                </p>
            </form>
        </div>
    </main>
</body>
</html>
