{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* This new class will control our background */
        .full-background {
            /*
              VVV --- PUT YOUR IMAGE PATH HERE --- VVV
              Ensure the path is correct. If it's in the same folder, this is fine.
            */
            background-image: url("{% static 'signup_bg.png' %}");

            /* These properties ensure the image covers the entire screen */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* These properties fix it to the background and place it behind other content */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* This is crucial - it places the div behind everything else */
        }
    </style>
</head>
<body>

    <!-- This is our new dedicated background element -->
    <div class="full-background"></div>

    <div class="min-h-screen flex items-center justify-center relative py-12">
        <!-- The signup form card, positioned on top of the background -->
        <div class="card w-full max-w-lg shrink-0 shadow-2xl bg-base-100 z-10">
            <form class="card-body" method="POST" action="{% url 'signin' %}">
                {% csrf_token %}
                <h2 class="card-title text-2xl font-bold mb-4">Create your account</h2>

                <!-- First Name and Last Name -->
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="form-control w-full sm:w-1/2">
                        <label class="label">
                            <span class="label-text">First Name</span>
                        </label>
                        <input type="text" name="fname" placeholder="John" class="input input-bordered" required />
                    </div>
                    <div class="form-control w-full sm:w-1/2">
                        <label class="label">
                            <span class="label-text">Last Name</span>
                        </label>
                        <input type="text" name="lname" placeholder="Doe" class="input input-bordered" required />
                    </div>
                </div>

                <!-- Username -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Username</span>
                    </label>
                    <input type="text" name="username" placeholder="johndoe" class="input input-bordered" required />
                </div>

                <!-- Email -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" name="email" placeholder="john.doe@example.com" class="input input-bordered" required />
                </div>

                <!-- Program Selection -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Select your Program</span>
                    </label>
                    <select class="select select-bordered" name="programId" required>
                        <option disabled selected>Choose your program</option>
                        {% for program in programs %}
                            <option value="{{ program.program_code }}">{{ program.program_code }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Password -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered" required />
                </div>

                <!-- Confirm Password -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Confirm Password</span>
                    </label>
                    <input type="password" name="confirm_password" class="input input-bordered" required />
                </div>

                <div class="form-control mt-6">
                    <button class="btn border-none text-black" style="background-color: #fde047; hover:background-color: #facc15;">Create Account</button>
                </div>

                <p class="text-center mt-4 text-sm">
                    Already have an account?
                    <a href="{% url 'login' %}" class="link" style="color: #d94b3d;">Log in</a>
                </p>
            </form>
        </div>
    </div>

</body>
</html>
